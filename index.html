<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/images/favicon.png">
    <title>𝑍𝐸𝑂</title>
</head>

<body>
    <nav>
        <a href="#/index"><span>Index</span></a>
        <a href="#/about"><span>About</span></a>
        <a href="https://space.bilibili.com/1144126402" target="_blank"><span>Bilibili</span></a>
        <a href="https://steamcommunity.com/profiles/76561199196480008/" target="_blank" class="nav_right"><span>Steam</span></a>
    </nav>
    <div id="index" class="page" style="text-align: center;"><h1 style="font-size: 150px;">𝑍𝐸𝑂</h1></div>
    <div id="about"class="page" ><h1>About</h1><h3>File:</h3><a href="./scripts/cookie.json" download="cookie.json">cookie.json</a></div>
    <script>
        // 路由表：hash 路径 -> 页面 id
        const routes = {
            '/index': 'index',
            '/about': 'about',
        };

        function router() {
            // 取出 hash，例如 "#/about" -> "/about"
            let path = location.hash.slice(1) || '/index';

            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

            // 显示匹配的页面，找不到就回退到首页
            const pageId = routes[path] || 'index';
            document.getElementById(pageId).classList.add('active');
        }

        // 监听 hash 变化
        window.addEventListener('hashchange', router);

        // 首次加载时执行
        window.addEventListener('load', router);
    </script>
</body>

</html>
