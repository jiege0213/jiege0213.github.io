<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Hash 路由示例</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    nav a { margin-right: 15px; }
    .page { display: none; padding: 10px; border: 1px solid #ccc; margin-top: 10px; }
    .page.active { display: block; }
  </style>
</head>
<body>

  <h1>Hash 路由示例（#/）</h1>

  <!-- 导航链接：点击后 URL 变为 #/home、#/about、#/contact -->
  <nav>
    <a href="#/home">首页</a>
    <a href="#/about">关于</a>
    <a href="#/contact">联系</a>
  </nav>

  <!-- 三个页面容器 -->
  <div id="home" class="page">这是 <strong>首页</strong> 内容</div>
  <div id="about" class="page">这是 <strong>关于</strong> 页面</div>
  <div id="contact" class="page">这是 <strong>联系</strong> 页面</div>

  <script>
    // 路由表：hash 路径 -> 页面 id
    const routes = {
      '/home': 'home',
      '/about': 'about',
      '/contact': 'contact'
    };

    function router() {
      // 取出 hash，例如 "#/about" -> "/about"
      let path = location.hash.slice(1) || '/home';

      // 隐藏所有页面
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

      // 显示匹配的页面，找不到就回退到首页
      const pageId = routes[path] || 'home';
      document.getElementById(pageId).classList.add('active');
    }

    // 监听 hash 变化
    window.addEventListener('hashchange', router);

    // 首次加载时执行
    window.addEventListener('load', router);
  </script>

</body>
</html>
